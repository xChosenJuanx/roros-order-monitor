<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Roro's Order Monitor</title><link rel="stylesheet" href="style.css"></head><body>
<header><img src="assets/logo.png"><div><h1>Roro's Order Monitor</h1><span id="conn">Starting…</span></div></header>
<main>
<section id="login" class="card"><h2>Admin Login</h2><p>Sign in using the same Roro's Cravings admin account.</p><form id="loginForm"><input id="email" type="email" placeholder="Admin email" required autocomplete="username"><input id="password" type="password" placeholder="Password" required autocomplete="current-password"><button>Sign In</button></form><p id="err" class="err"></p></section>
<section id="monitor" hidden><div class="bar"><div><b id="count">0 Pending</b><small>Live order monitor</small></div><button id="sound">🔊 Sound On</button></div><div id="flash" hidden>🔔 NEW ORDER!</div><div id="orders"><p class="empty">Waiting for orders…</p></div><button id="logout" class="ghost">Sign out</button></section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="app.js"></script></body></html>
